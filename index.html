<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-t="windowTitle">HyperRust</title>
    <link rel="stylesheet" href="/src/settings.css" />
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="brand">
          <svg class="logo" viewBox="0 0 1024 1024" aria-hidden="true">
            <defs>
              <linearGradient id="logo-bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ffb01f" />
                <stop offset=".4" stop-color="#ff5a1f" />
                <stop offset=".78" stop-color="#e5195f" />
                <stop offset="1" stop-color="#8b2bd9" />
              </linearGradient>
            </defs>
            <rect x="32" y="32" width="960" height="960" rx="236" fill="url(#logo-bg)" />
            <path d="M208 336 L392 512 L208 688" fill="none" stroke="#fff" stroke-width="116" stroke-linecap="round" stroke-linejoin="round" />
            <g fill="#fff">
              <rect x="504" y="400" width="92" height="224" rx="46" />
              <rect x="644" y="278" width="92" height="468" rx="46" />
              <rect x="784" y="366" width="92" height="292" rx="46" />
            </g>
          </svg>
          <div>
            <strong>HyperRust</strong>
            <span id="build" class="muted"></span>
          </div>
        </div>
        <nav data-t-aria-label="navSections">
          <button type="button" class="nav" data-page="overview">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1" /><rect x="14" y="3" width="7" height="5" rx="1" /><rect x="14" y="12" width="7" height="9" rx="1" /><rect x="3" y="16" width="7" height="5" rx="1" /></svg>
            <span data-t="pageOverview"></span>
          </button>
          <button type="button" class="nav" data-page="modes">
            <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" /></svg>
            <span data-t="pageModes"></span>
          </button>
          <button type="button" class="nav" data-page="history">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>
            <span data-t="pageHistory"></span>
          </button>
          <button type="button" class="nav" data-page="dictionary">
            <svg viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v16H6.5a2.5 2.5 0 0 0 0 5H20" /><path d="M9 8h7M9 12h5" /></svg>
            <span data-t="pageDictionary"></span>
          </button>
          <p class="nav-group" data-t="navSettings"></p>
          <button type="button" class="nav" data-page="shortcuts">
            <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2" /><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M7 15h10" /></svg>
            <span data-t="pageShortcuts"></span>
          </button>
          <button type="button" class="nav" data-page="audio">
            <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3" /><path d="M5 10a7 7 0 0 0 14 0M12 17v5" /></svg>
            <span data-t="pageAudio"></span>
          </button>
          <button type="button" class="nav" data-page="paste">
            <svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1" /><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" /></svg>
            <span data-t="pagePaste"></span>
          </button>
          <button type="button" class="nav" data-page="stt">
            <svg viewBox="0 0 24 24"><path d="M2 10v3M6 6v11M10 3v18M14 8v7M18 5v13M22 10v3" /></svg>
            <span data-t="pageStt"></span>
          </button>
          <button type="button" class="nav" data-page="llm">
            <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z" /><path d="M19 3v4M17 5h4" /></svg>
            <span data-t="pageLlm"></span>
          </button>
          <button type="button" class="nav" data-page="keys">
            <svg viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5" /><path d="M11.5 11.5 21 2M18 5l3 3M15 8l2 2" /></svg>
            <span data-t="pageKeys"></span>
          </button>
          <button type="button" class="nav" data-page="general">
            <svg viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1" /><circle cx="15" cy="6" r="2" /><circle cx="9" cy="12" r="2" /><circle cx="17" cy="18" r="2" /></svg>
            <span data-t="pageGeneral"></span>
          </button>
        </nav>
        <p class="side-foot"><kbd id="side-hotkey"></kbd> <span data-t="sideFoot"></span></p>
      </aside>

      <main>
        <!-- ===== Przegląd ===== -->
        <section class="page wide" data-page="overview" aria-labelledby="h-overview">
          <div class="page-head">
            <div>
              <h1 id="h-overview" data-t="pageOverview"></h1>
              <p class="muted" id="ov-status" data-t="loadingBalance"></p>
            </div>
            <button type="button" id="ov-refresh" data-t="refresh"></button>
          </div>
          <div class="tiles">
            <button type="button" class="tile" data-goto="shortcuts"><span data-t="tileShortcut"></span><strong id="ov-hotkey"></strong><small id="ov-hotkey-sub"></small></button>
            <button type="button" class="tile" data-goto="modes"><span data-t="tileMode"></span><strong id="ov-mode"></strong><small id="ov-mode-sub"></small></button>
            <button type="button" class="tile" data-goto="stt"><span data-t="tileStt"></span><strong id="ov-stt"></strong><small id="ov-stt-sub"></small></button>
            <button type="button" class="tile" data-goto="llm"><span data-t="pageLlm"></span><strong id="ov-llm"></strong><small id="ov-llm-sub"></small></button>
          </div>

          <h2 data-t="balance"></h2>
          <div class="balances" id="balances"></div>
          <p class="hint" id="balance-note"></p>

          <h2 data-t="hNewModels"></h2>
          <div class="balances" id="news"></div>
          <p class="hint" id="news-note"></p>

          <h2 data-t="hUsage"></h2>
          <div class="card pad">
            <div class="stats" id="usage-stats"></div>
            <div class="chart" id="usage-chart" role="img"></div>
            <div class="chart-axis"><span id="chart-from"></span><span data-t="chartAxis"></span><span data-t="chartToday"></span></div>
          </div>

          <h2 data-t="hTimings"></h2>
          <div class="card pad">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th data-t="thResult"></th><th data-t="tileMode"></th><th>STT</th><th data-t="thLive"></th><th data-t="thRecording"></th><th data-t="thToText"></th><th>LLM</th><th data-t="thToPaste"></th><th data-t="thChars"></th><th data-t="thCost"></th>
                  </tr>
                </thead>
                <tbody id="timings"></tbody>
              </table>
            </div>
            <p class="hint" data-t-html="timingsHint"></p>
          </div>
        </section>

        <!-- ===== Tryby ===== -->
        <section class="page" data-page="modes" aria-labelledby="h-modes" hidden>
          <div class="page-head">
            <div>
              <h1 id="h-modes" data-t="pageModes"></h1>
              <p class="muted" data-t="modesDesc"></p>
            </div>
            <button type="button" id="add-mode" data-t="addMode"></button>
          </div>
          <div id="modes"></div>
        </section>

        <!-- ===== Historia ===== -->
        <section class="page" data-page="history" aria-labelledby="h-history" hidden>
          <div class="page-head">
            <div>
              <h1 id="h-history" data-t="pageHistory"></h1>
              <p class="muted" id="hist-status"></p>
            </div>
            <input type="search" id="hist-search" data-t-placeholder="searchHistory" data-t-aria-label="searchHistory" />
          </div>
          <div id="history-list"></div>
        </section>

        <!-- ===== Słownik ===== -->
        <section class="page" data-page="dictionary" aria-labelledby="h-dictionary" hidden>
          <div class="page-head">
            <div>
              <h1 id="h-dictionary" data-t="pageDictionary"></h1>
              <p class="muted" data-t="dictionaryDesc"></p>
            </div>
          </div>
          <textarea id="stt_dictionary" rows="18" spellcheck="false" data-t-aria-label="pageDictionary" aria-describedby="dictionary-hint" placeholder="Claude Code = Cloud Code, CloudCode"></textarea>
          <p class="hint" id="dictionary-hint" data-t="dictionaryHint"></p>
        </section>

        <!-- ===== Skróty ===== -->
        <section class="page" data-page="shortcuts" aria-labelledby="h-shortcuts" hidden>
          <div class="page-head"><h1 id="h-shortcuts" data-t="pageShortcuts"></h1></div>
          <div class="card list">
            <div class="set">
              <label class="set-text" for="hotkey"><b data-t="hotkeyLabel"></b><small data-t="hotkeyHint"></small></label>
              <div class="ctl">
                <input id="hotkey" class="kbd" readonly />
                <button type="button" id="hotkey-capture" data-t="change"></button>
              </div>
            </div>
            <div class="set">
              <label class="set-text" for="hotkey_mode"><b data-t="hotkeyMode"></b></label>
              <select id="hotkey_mode">
                <option value="auto" data-t="optAuto"></option>
                <option value="hold" data-t="optHold"></option>
                <option value="toggle" data-t="optToggle"></option>
              </select>
            </div>
            <div class="set">
              <span class="set-text"><b data-t="cancelLabel"></b><small data-t="cancelHint"></small></span>
              <kbd>Esc</kbd>
            </div>
          </div>
        </section>

        <!-- ===== Dźwięk i mikrofon ===== -->
        <section class="page" data-page="audio" aria-labelledby="h-audio" hidden>
          <div class="page-head"><h1 id="h-audio" data-t="pageAudio"></h1></div>
          <div class="card list">
            <div class="set">
              <label class="set-text" for="audio_device"><b data-t="microphone"></b></label>
              <select id="audio_device"><option value="" data-t="systemDefault"></option></select>
            </div>
            <div class="set">
              <label class="set-text" for="audio_keep_warm"><b data-t="keepWarm"></b><small data-t="keepWarmHint"></small></label>
              <input type="checkbox" class="switch" role="switch" id="audio_keep_warm" />
            </div>
            <div class="set">
              <label class="set-text" for="audio_cues"><b data-t="cues"></b><small data-t="cuesHint"></small></label>
              <input type="checkbox" class="switch" role="switch" id="audio_cues" />
            </div>
          </div>
          <details class="adv">
            <summary data-t="advanced"></summary>
            <div class="card list">
              <div class="set">
                <label class="set-text" for="audio_preroll_ms"><b data-t="preroll"></b><small data-t="prerollHint"></small></label>
                <span class="unit"><input id="audio_preroll_ms" type="number" min="0" max="2000" step="50" />ms</span>
              </div>
              <div class="set">
                <label class="set-text" for="audio_min_duration_ms"><b data-t="minDuration"></b><small data-t="minDurationHint"></small></label>
                <span class="unit"><input id="audio_min_duration_ms" type="number" min="0" step="50" />ms</span>
              </div>
            </div>
          </details>
        </section>

        <!-- ===== Wklejanie ===== -->
        <section class="page" data-page="paste" aria-labelledby="h-paste" hidden>
          <div class="page-head"><h1 id="h-paste" data-t="pagePaste"></h1></div>
          <div class="card list">
            <div class="set">
              <label class="set-text" for="paste_auto_paste"><b data-t="autoPaste"></b><small data-t="autoPasteHint"></small></label>
              <input type="checkbox" class="switch" role="switch" id="paste_auto_paste" />
            </div>
            <div class="set">
              <label class="set-text" for="paste_restore_clipboard"><b data-t="restoreClipboard"></b><small data-t="restoreClipboardHint"></small></label>
              <input type="checkbox" class="switch" role="switch" id="paste_restore_clipboard" />
            </div>
          </div>
          <details class="adv">
            <summary data-t="advanced"></summary>
            <div class="card list">
              <div class="set">
                <label class="set-text" for="paste_restore_delay_ms"><b data-t="restoreDelay"></b></label>
                <span class="unit"><input id="paste_restore_delay_ms" type="number" min="100" step="100" />ms</span>
              </div>
            </div>
          </details>
        </section>

        <!-- ===== Rozpoznawanie mowy ===== -->
        <section class="page" data-page="stt" aria-labelledby="h-stt" hidden>
          <div class="page-head"><h1 id="h-stt" data-t="pageStt"></h1></div>
          <div class="card list">
            <div class="set">
              <label class="set-text" for="stt_provider"><b data-t="provider"></b><small id="stt-in-use"></small></label>
              <div class="ctl">
                <button type="button" class="badge" id="stt-key"></button>
                <select id="stt_provider">
                  <option value="elevenlabs">ElevenLabs (Scribe)</option>
                  <option value="xai">xAI (Grok)</option>
                  <option value="openai">OpenAI</option>
                  <option value="openrouter" data-t="optOpenRouterBatch"></option>
                </select>
              </div>
            </div>
            <div class="set">
              <label class="set-text" for="stt_streaming"><b data-t="streaming"></b><small data-t="streamingHint"></small></label>
              <input type="checkbox" class="switch" role="switch" id="stt_streaming" />
            </div>
            <!-- Each model is a picker over a hidden name field (shown for "Enter another name…"). -->
            <div class="set" data-stt="elevenlabs">
              <label class="set-text" for="m_elevenlabs_realtime_pick"><b data-t="liveModel"></b></label>
              <div class="ctl"><input id="m_elevenlabs_realtime" hidden spellcheck="false" data-t-placeholder="modelNamePlaceholder" data-t-aria-label="liveModelAria" /><select id="m_elevenlabs_realtime_pick"></select></div>
            </div>
            <div class="set" data-stt="elevenlabs">
              <label class="set-text" for="m_elevenlabs_pick"><b data-t="batchModel"></b><small data-t="batchModelHint"></small></label>
              <div class="ctl"><input id="m_elevenlabs" hidden spellcheck="false" data-t-placeholder="modelNamePlaceholder" data-t-aria-label="batchModelAria" /><select id="m_elevenlabs_pick"></select></div>
            </div>
            <div class="set" data-stt="xai">
              <label class="set-text" for="m_xai_pick"><b data-t="model"></b><small data-t="xaiModelHint"></small></label>
              <div class="ctl"><input id="m_xai" hidden spellcheck="false" data-t-placeholder="modelNamePlaceholder" data-t-aria-label="modelName" /><select id="m_xai_pick"></select></div>
            </div>
            <div class="set" data-stt="openai">
              <label class="set-text" for="m_openai_realtime_pick"><b data-t="liveModel"></b></label>
              <div class="ctl"><input id="m_openai_realtime" hidden spellcheck="false" data-t-placeholder="modelNamePlaceholder" data-t-aria-label="liveModelAria" /><select id="m_openai_realtime_pick"></select></div>
            </div>
            <div class="set" data-stt="openai">
              <label class="set-text" for="m_openai_pick"><b data-t="batchModel"></b><small data-t="batchModelHint"></small></label>
              <div class="ctl"><input id="m_openai" hidden spellcheck="false" data-t-placeholder="modelNamePlaceholder" data-t-aria-label="batchModelAria" /><select id="m_openai_pick"></select></div>
            </div>
            <div class="set" data-stt="openrouter">
              <label class="set-text" for="m_openrouter_pick"><b data-t="model"></b><small data-t="openrouterModelHint"></small></label>
              <div class="ctl"><input id="m_openrouter" hidden spellcheck="false" data-t-placeholder="modelNamePlaceholder" data-t-aria-label="modelName" /><select id="m_openrouter_pick"></select></div>
            </div>
            <div class="set">
              <label class="set-text" for="stt_language"><b data-t="language"></b><small data-t="languageHint"></small></label>
              <input id="stt_language" class="short" maxlength="8" placeholder="auto" />
            </div>
          </div>
          <p class="hint" id="stt-models-status"></p>
          <details class="adv">
            <summary data-t="advanced"></summary>
            <div class="card list">
              <div class="set">
                <label class="set-text" for="stt_final_timeout_ms"><b data-t="finalTimeout"></b></label>
                <span class="unit"><input id="stt_final_timeout_ms" type="number" min="1000" step="500" />ms</span>
              </div>
            </div>
          </details>
        </section>

        <!-- ===== Post-processing ===== -->
        <section class="page" data-page="llm" aria-labelledby="h-llm" hidden>
          <div class="page-head">
            <div>
              <h1 id="h-llm" data-t="pageLlm"></h1>
              <p class="muted" data-t="llmDesc"></p>
            </div>
          </div>
          <div class="card list">
            <div class="set">
              <label class="set-text" for="llm_backend"><b data-t="backend"></b></label>
              <div class="ctl">
                <button type="button" class="badge" id="llm-key"></button>
                <select id="llm_backend">
                  <option value="open_ai_compatible" data-t="optCliProxy"></option>
                  <option value="open_router" data-t="optOpenRouterPaid"></option>
                  <option value="claude_cli">claude -p (Claude Code)</option>
                  <option value="codex_cli">codex exec (Codex CLI)</option>
                </select>
              </div>
            </div>
            <div class="set" data-backend="open_ai_compatible open_router">
              <label class="set-text" for="llm_model_pick"><b data-t="model"></b><small id="models-status"></small></label>
              <div class="ctl">
                <select id="llm_model_pick"></select>
                <button type="button" class="icon" id="models-refresh" data-t-title="modelsRefreshTitle" data-t-aria-label="modelsRefreshAria">
                  <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8" /><path d="M21 3v5h-5" /></svg>
                </button>
              </div>
            </div>
            <div class="set" id="llm_model_custom_row" hidden>
              <label class="set-text" for="llm_model_custom"><b data-t="modelName"></b></label>
              <input id="llm_model_custom" data-t-placeholder="llmCustomPlaceholder" spellcheck="false" autocomplete="off" />
            </div>
            <div class="set" data-backend="claude_cli codex_cli">
              <label class="set-text" for="llm_cli_model"><b data-t="cliModel"></b><small data-t="cliModelHint"></small></label>
              <input id="llm_cli_model" spellcheck="false" />
            </div>
          </div>
          <h2 data-t="hRanking"></h2>
          <div class="card pad">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>#</th><th data-t="model"></th><th data-t="thScore"></th><th data-t="thTime"></th><th data-t="thPer1000"></th><th data-t="thTest"></th><th></th>
                  </tr>
                </thead>
                <tbody id="ranking"></tbody>
              </table>
            </div>
            <button type="button" class="link" id="ranking-more" hidden></button>
            <p class="hint" id="ranking-status" role="status"></p>
            <p class="hint" id="ranking-note"></p>
          </div>
          <details class="adv">
            <summary data-t="advanced"></summary>
            <div class="card list">
              <div class="set" data-backend="open_ai_compatible">
                <label class="set-text" for="llm_base_url"><b data-t="endpoint"></b></label>
                <input id="llm_base_url" placeholder="http://localhost:8317/v1" spellcheck="false" />
              </div>
              <div class="set" data-backend="open_ai_compatible open_router">
                <label class="set-text" for="llm_reasoning_effort"><b>Reasoning effort</b><small data-t="effortHint"></small></label>
                <input id="llm_reasoning_effort" class="short" data-t-placeholder="effortPlaceholder" spellcheck="false" />
              </div>
              <div class="set">
                <label class="set-text" for="llm_timeout_ms"><b data-t="timeout"></b></label>
                <span class="unit"><input id="llm_timeout_ms" type="number" min="1000" step="1000" />ms</span>
              </div>
            </div>
          </details>
          <!-- The saved model per backend; the picker above edits the active one. -->
          <input type="hidden" id="llm_model" />
          <input type="hidden" id="llm_openrouter_model" />
        </section>

        <!-- ===== Klucze API ===== -->
        <section class="page" data-page="keys" aria-labelledby="h-keys" hidden>
          <div class="page-head">
            <div>
              <h1 id="h-keys" data-t="pageKeys"></h1>
              <p class="muted" data-t="keysDesc"></p>
            </div>
          </div>
          <div class="card list" id="secrets"></div>
        </section>

        <!-- ===== Ogólne ===== -->
        <section class="page" data-page="general" aria-labelledby="h-general" hidden>
          <div class="page-head"><h1 id="h-general" data-t="pageGeneral"></h1></div>
          <div class="card list">
            <div class="set">
              <label class="set-text" for="ui_language"><b>Language / Język</b></label>
              <select id="ui_language">
                <option value="en">English</option>
                <option value="pl" lang="pl">Polski</option>
              </select>
            </div>
            <div class="set">
              <label class="set-text" for="autostart"><b data-t="autostart"></b><small data-t="autostartHint"></small></label>
              <input type="checkbox" class="switch" role="switch" id="autostart" />
            </div>
            <div class="set">
              <label class="set-text" for="upd_enabled"><b data-t="autoUpdates"></b><small id="update-status"></small></label>
              <div class="ctl">
                <button type="button" id="update-check" data-t="check"></button>
                <input type="checkbox" class="switch" role="switch" id="upd_enabled" />
              </div>
            </div>
            <div class="set">
              <label class="set-text" for="hist_enabled"><b data-t="saveHistory"></b><small data-t="saveHistoryHint"></small></label>
              <input type="checkbox" class="switch" role="switch" id="hist_enabled" />
            </div>
            <div class="set">
              <label class="set-text" for="keep_connections_warm"><b data-t="keepConnections"></b><small data-t="keepConnectionsHint"></small></label>
              <input type="checkbox" class="switch" role="switch" id="keep_connections_warm" />
            </div>
            <div class="set">
              <span class="set-text"><b data-t="logs"></b><small id="logs-dir"></small></span>
              <button type="button" id="open-logs" data-t="openFolder"></button>
            </div>
          </div>
          <h2 data-t="hAbout"></h2>
          <div class="card list">
            <div class="set">
              <span class="set-text"><b data-t="author"></b><small data-t="authorValue"></small></span>
              <button type="button" class="link" data-link="repo">github.com/jarx-dev/HyperRust</button>
            </div>
            <div class="set">
              <span class="set-text"><b data-t="coffee"></b><small data-t="coffeeHint"></small></span>
              <button type="button" data-link="coffee" data-t="coffeeButton"></button>
            </div>
          </div>
          <details class="adv">
            <summary data-t="advanced"></summary>
            <div class="card list">
              <div class="set">
                <label class="set-text" for="upd_url"><b data-t="updateServer"></b></label>
                <input id="upd_url" spellcheck="false" />
              </div>
              <div class="set">
                <label class="set-text" for="upd_interval_s"><b data-t="checkEvery"></b></label>
                <span class="unit"><input id="upd_interval_s" type="number" min="15" step="15" />s</span>
              </div>
              <div class="set">
                <label class="set-text" for="hist_upload_url"><b data-t="historyServer"></b><small data-t="historyServerHint"></small></label>
                <input id="hist_upload_url" spellcheck="false" />
              </div>
            </div>
          </details>
        </section>
      </main>
    </div>

    <footer>
      <span id="save-status" role="status" aria-live="polite"></span>
      <button type="button" id="save" class="primary" data-t="save"></button>
    </footer>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
