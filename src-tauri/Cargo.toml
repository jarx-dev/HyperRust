[package]
name = "hyperrust"
version = "0.1.0"
description = "HyperRust — dyktowanie promptów dla agentów AI (Tauri 2)"
authors = ["Jarosław Hartwich"]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace]
members = ["crates/core"]
resolver = "2"

[lib]
name = "hyperrust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hyperrust-core = { path = "crates/core" }

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"

reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }
# keyring 3: v4 pulls a SQLite fallback store we never use (see Poprawiacz-rs).
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native", "linux-native"] }

# The dictation path (microphone, paste) is Windows-only; Linux builds exist for
# CI checks and tests and use stubs, so they need no ALSA/X11 dev packages.
[target.'cfg(windows)'.dependencies]
enigo = "0.6"
cpal = "0.18"
winreg = "0.56"
clipboard-win = "5"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_DataExchange",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
] }

# Small, fast binary (as in Poprawiacz-rs).
[profile.release]
lto = "fat"
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true
incremental = false

# Faster cross builds for the Tailscale dev-update loop (scripts/publish-dev.sh).
[profile.dev-release]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
