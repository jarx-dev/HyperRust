<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Prompt chevron followed by a voice waveform: "dictated prompt". -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb01f"/>
      <stop offset=".4" stop-color="#ff5a1f"/>
      <stop offset=".78" stop-color="#e5195f"/>
      <stop offset="1" stop-color="#8b2bd9"/>
    </linearGradient>
    <radialGradient id="shine" cx=".28" cy=".16" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4a0626" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="236" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="236" fill="url(#shine)"/>
  <rect x="44" y="44" width="936" height="936" rx="224" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="10"/>
  <g filter="url(#shadow)" fill="#fff">
    <path d="M208 336 L392 512 L208 688" fill="none" stroke="#fff" stroke-width="116" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="504" y="400" width="92" height="224" rx="46"/>
    <rect x="644" y="278" width="92" height="468" rx="46"/>
    <rect x="784" y="366" width="92" height="292" rx="46"/>
  </g>
</svg>
