<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HyperRust</title>
    <link rel="stylesheet" href="/src/overlay.css" />
  </head>
  <body>
    <div id="root" class="root hidden">
      <div id="shell" class="shell">
        <div class="glow" aria-hidden="true"></div>
        <div id="pill" class="pill" role="status" aria-live="polite">
          <span class="orb" aria-hidden="true">
            <span class="halo"></span>
            <span class="ripple"></span>
            <span class="spinner"></span>
            <span class="core"></span>
            <svg class="mark check" viewBox="0 0 16 16"><path d="M4 8.4l2.6 2.6L12 5.4" /></svg>
            <svg class="mark bang" viewBox="0 0 16 16"><path d="M8 4.2v4.6M8 11.6v.1" /></svg>
          </span>
          <span id="wave" class="wave" aria-hidden="true"></span>
          <span id="label" class="label"></span>
          <button id="mode" class="mode" type="button" title="Zmień tryb" hidden>
            <span id="mode-name"></span>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5.5h9.5M10 3l2.5 2.5L10 8M13 10.5H3.5M6 8l-2.5 2.5L6 13" /></svg>
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
