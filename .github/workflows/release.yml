# A release from main, started by hand (Actions → Wydanie → Run workflow): HyperRust-<build>.exe
# and latest.json, from which released copies update themselves (core/src/update.rs). The tag is
# the build time (v26.1111.1215: year, month and day, hour and minute, Polish time). A PR that
# changes this file runs it without publishing anything.
name: Wydanie

on:
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: src-tauri

      - name: Wersja z czasu budowania
        id: v
        run: |
          $t = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $pl = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTimeOffset]::FromUnixTimeSeconds($t), 'Central European Standard Time')
          $sha = git rev-parse --short HEAD
          # HYPERRUST_BUILD switches the self-updater on (src-tauri/build.rs)
          "HYPERRUST_BUILT_AT=$t" >> $env:GITHUB_ENV
          "HYPERRUST_BUILD=$sha-$t" >> $env:GITHUB_ENV
          "tag=v$($pl.ToString('yy.MMdd.HHmm'))" >> $env:GITHUB_OUTPUT

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build

      - name: EXE i latest.json
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $name = "HyperRust-$env:HYPERRUST_BUILD.exe"
          New-Item -ItemType Directory release | Out-Null
          Copy-Item src-tauri/target/release/hyperrust.exe release/$name
          $exe = Get-Item release/$name
          $version = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $manifest = [ordered]@{
            version  = $version
            build    = $env:HYPERRUST_BUILD
            built_at = [long]$env:HYPERRUST_BUILT_AT
            sha256   = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
            url      = $name
            size     = $exe.Length
            notes    = "$(git log -1 --format=%s)"
          }
          # UTF-8 without a BOM: the app parses it with serde_json
          [IO.File]::WriteAllText("$PWD/release/latest.json", ($manifest | ConvertTo-Json))
          Get-Content release/latest.json
          "tag: ${{ steps.v.outputs.tag }}"

      - if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/HyperRust-*.exe

      - name: Wydanie na GitHubie
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" --target $env:GITHUB_SHA `
            --title "HyperRust ${{ steps.v.outputs.tag }}" --generate-notes `
            (Get-Item release/HyperRust-*.exe).FullName release/latest.json
