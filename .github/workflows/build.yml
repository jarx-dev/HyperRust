name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only *.md, docs/ or LICENSE changed: both jobs below are skipped, and branch protection counts
  # a skipped job as passed (with no workflow run at all the required checks would wait for good).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # what cannot be told (a new branch, a forced push, a manual run) counts as code
          if files=$(git diff --name-only "$BASE" "$GITHUB_SHA") && [ -n "$files" ] && ! grep -qvE '\.md$|^docs/|^LICENSE' <<<"$files"; then
            echo code=false >> "$GITHUB_OUTPUT"
          else
            echo code=true >> "$GITHUB_OUTPUT"
          fi

  # Quality gates on Linux (no GUI bundle; the Windows-only audio/paste code
  # is linted by the Windows job's build).
  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Typecheck + build frontend
        run: pnpm build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --workspace --locked

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Portable single-file .exe (no installer). WebView2 ships with Windows 10/11.
  windows-portable:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Clippy (Windows code paths)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build portable exe
        run: pnpm tauri build

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: HyperRust-portable-windows
          path: src-tauri/target/release/hyperrust.exe
          if-no-files-found: error
